name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_web.py --check
      - name: Build PDFCraft (Windows ${{ matrix.goarch }})
        working-directory: go
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -trimpath -o ../PDFCraft-windows-${{ matrix.goarch }}.exe ./cmd/pdfcraft
      - uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-windows-${{ matrix.goarch }}
          path: PDFCraft-windows-${{ matrix.goarch }}.exe

  publish:
    needs: release-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sha256sum PDFCraft-windows-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PDFCraft-windows-amd64.exe
            PDFCraft-windows-arm64.exe
            SHA256SUMS.txt
            HUONG-DAN.md
            go/pkg/pdfcraft/fonts/OFL.txt
            go/pkg/pdfcraft/fonts/NOTICE.md
          fail_on_unmatched_files: true
          generate_release_notes: true
