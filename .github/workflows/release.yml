name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_web.py --check
      - working-directory: go
        run: go build -ldflags="-s -w" -o ../PDFCraft.exe ./cmd/pdfcraft
      - uses: softprops/action-gh-release@v2
        with:
          files: PDFCraft.exe
          generate_release_notes: true
