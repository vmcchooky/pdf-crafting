[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcraft"
version = "1.1.0"
description = "PDF Craft - cong cu xu ly PDF toc do cao: tach, gop, xoay, watermark, ma hoa, nen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pypdf>=6"]

[project.scripts]
pdfcraft = "pdfcraft.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
